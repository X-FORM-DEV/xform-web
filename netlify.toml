# Sitio estático de X.FORM. Netlify publica la raíz tal cual (sin build).
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Página de enlaces de la bio de Instagram
[[redirects]]
  from = "/links"
  to = "/links.html"
  status = 200
